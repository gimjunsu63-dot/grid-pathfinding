name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # same as the course container
      - name: Run unit tests
        run: make test
      - name: Run demo
        run: make run
      - name: Run every experiment on tiny maps
        run: make bench-quick
      - name: Draw figures
        run: make figures
